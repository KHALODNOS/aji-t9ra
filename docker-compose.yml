# version: "3.8"

services:
  server:
    build: ./server
    env_file: ./server/.env # سيتم سحب رابط Atlas السري من هنا
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
